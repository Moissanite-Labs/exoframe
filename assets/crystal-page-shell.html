<!-- Crystal project view shell (embed via aggregate; config via #exo-lattice-data or window.__EXO_LATTICE__) -->
<div class="exo-crystal" data-exo-crystal-shell>
<section class="demo-banner" data-exo-rehearsal-banner hidden aria-label="Rehearsal information">
<div><strong data-exo-rehearsal-label>EXOFAB / REHEARSAL</strong><p data-exo-rehearsal-copy></p></div>
<div class="demo-tools">
<a href="#exo-crystal-decision" data-exo-try-decision>Try the decision ↓</a>
<button type="button" id="demoMotion" aria-pressed="false">Pause motion</button>
<button type="button" id="demoReset" data-exo-rehearsal-only hidden>Reset demo</button>
<button type="button" id="demoExport" data-exo-rehearsal-only hidden>Download demo log</button>
<a href="https://github.com/Moissanite-Labs/exoframe" rel="noopener noreferrer">Source &amp; project</a>
</div>
</section>
<noscript><p class="demo-banner">JavaScript is required for the interactive project view. Static summaries remain readable without it.</p></noscript>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><polygon points="11,1 20,6 20,16 11,21 2,16 2,6" fill="none" stroke="#eceef0" stroke-width="1.2"/><circle cx="11" cy="11" r="2.4" fill="#f2ab6d"/><rect x="13.6" y="4.6" width="3.2" height="3.2" transform="rotate(45 15.2 6.2)" fill="#7cc6f2"/><line x1="11" y1="11" x2="15.2" y2="6.2" stroke="#eceef0" stroke-width=".8"/></svg>
    <span aria-hidden="true">EXOFAB</span>
  </div>
  <nav class="crumbs" aria-label="Breadcrumb" data-exo-crumbs></nav>
  <div class="spacer"></div>
  <span class="chip" data-exo-header-chip hidden></span>
  <div class="me" data-exo-visitor hidden></div>
</header>

<main class="wrap" id="demo-start">
  <section class="hero" aria-labelledby="proj-h">
    <div>
      <div class="mono" data-exo-eyebrow></div>
      <h1 id="proj-h"><span data-exo-title></span> <em data-exo-subtitle></em></h1>
      <p data-exo-blurb></p>
      <div class="actions" data-exo-project-actions style="margin-top:12px"></div>
    </div>
    <ol class="stages" id="stages" aria-label="Project stages" data-exo-stages></ol>
  </section>

  <div class="grid">
    <section class="panel stagepanel col-c" aria-labelledby="lat-h">
      <div class="ph"><h2 id="lat-h">The crystal</h2><span class="mono">each node is a piece of work</span></div>
      <div class="lat" id="lat">
        <svg id="svg" viewBox="-204 -184 408 368" role="group" aria-label="Project lattice"></svg>
        <div class="tip" id="tip" aria-hidden="true"></div>
      </div>
      <ol class="census" aria-label="Rings of the crystal, one per stage" data-exo-census></ol>
      <div class="latfoot"><span id="latcount"></span><span data-exo-latfoot-note>Rings grow outward, idea to ship</span></div>
    </section>

    <div class="col-d">
      <section class="panel decision" id="decision" aria-labelledby="dec-h" data-exo-decision-panel></section>
    </div>
  </div>

  <div class="lower">
    <section class="panel" aria-labelledby="crew-h">
      <div class="ph"><h2 id="crew-h">Crew</h2><span class="mono" data-exo-crew-meta></span></div>
      <ul class="crew" data-exo-crew-list></ul>
      <form class="crew-interest" data-exo-role-form hidden>
        <label class="mono" for="exoRoleSlot">I can help</label>
        <select id="exoRoleSlot" name="slot" data-exo-role-select></select>
        <button type="submit" class="btn ghost">Send interest</button>
        <p class="why" data-exo-role-status hidden role="status"></p>
      </form>
      <div class="legend"><span><i class="lh"></i>Carbon · person</span><span><i class="la"></i>Silicon · agent</span></div>
    </section>

    <section class="panel" aria-labelledby="live-h">
      <div class="ph"><h2 id="live-h">Live work</h2><span class="mono" data-exo-live-meta></span></div>
      <ul class="live" data-exo-live-list></ul>
    </section>

    <section class="panel tracep" aria-labelledby="tr-h">
      <div class="ph"><h2 id="tr-h">Trace</h2><span class="mono">where work came from · hover to find it</span></div>
      <ol class="trace" id="trace" data-exo-trace-list></ol>
    </section>
  </div>

  <footer data-exo-crystal-footer></footer>
</main>

<div class="ms" id="ms" role="dialog" aria-modal="false" aria-labelledby="msT" hidden>
  <svg class="gem" viewBox="0 0 44 44" aria-hidden="true">
    <defs><linearGradient id="fireg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2ab6d"/><stop offset=".35" stop-color="#f6e27a"/><stop offset=".6" stop-color="#8fe0b0"/><stop offset=".8" stop-color="#7cc6f2"/><stop offset="1" stop-color="#b9a2ff"/></linearGradient></defs>
    <polygon class="facet" points="22,2 40,12 40,32 22,42 4,32 4,12" fill="none" stroke="url(#fireg)" stroke-width="1.5"/>
    <polygon class="facet" points="22,10 32,16 32,28 22,34 12,28 12,16" fill="url(#fireg)" opacity=".25" style="animation-delay:.15s"/>
    <polygon class="facet" points="22,10 32,16 22,22 12,16" fill="#fff" opacity=".35" style="animation-delay:.3s"/>
  </svg>
  <div><div class="t1" id="msT"></div><div class="t2" data-exo-ms-sub></div></div>
  <button type="button" class="mini" id="msClose">Close</button>
</div>
<div class="sr" aria-live="polite" id="announce"></div>
<div class="sr" aria-live="polite" id="announce2"></div>
</div>
