name: Aggregate project pages

# Trusted workflow file + scripts run only from the default branch (main).
# Manual dispatch must be run on main — not from feature branches.

on:
  workflow_dispatch:
    inputs:
      import_from_project_branch:
        description: Copy JSON from allowlisted project/<slug> branch into project-sources/
        type: boolean
        default: true
      slug:
        description: Allowlisted project slug
        type: choice
        options:
          - harbor-light
      force:
        description: Force regeneration even when fingerprints match
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "project-sources/**"

concurrency:
  group: aggregate-projects-main
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        !contains(github.event.head_commit.message, '[aggregate]')) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Resolve trusted default-branch SHA (scripts + workflow)
        id: trusted
        run: |
          TRUSTED_SHA="${{ github.event.repository.default_branch }}"
          echo "ref=$TRUSTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted default branch at pinned SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.trusted.outputs.ref }}
          fetch-depth: 0

      - name: Record trusted tree SHA
        id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch allowlisted project branch (JSON blobs only)
        if: github.event_name == 'workflow_dispatch' && inputs.import_from_project_branch
        run: git fetch --depth=1 origin "project/${{ inputs.slug }}"

      - name: Import project branch JSON into project-sources
        if: github.event_name == 'workflow_dispatch' && inputs.import_from_project_branch
        run: |
          git checkout "${{ steps.pin.outputs.sha }}" -- scripts/import_project_branch.py scripts/aggregate_projects.py
          python3 scripts/import_project_branch.py "${{ inputs.slug }}"

      - name: Run aggregation (JSON inputs only)
        id: result
        run: |
          git checkout "${{ steps.pin.outputs.sha }}" -- scripts/aggregate_projects.py
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.import_from_project_branch }}" = "true" ]; then
            FORCE="--force"
          fi
          python3 scripts/aggregate_projects.py $FORCE
          if git diff --quiet -- project-sources projects data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated artifacts
        if: steps.result.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-project-pages
          path: |
            project-sources/
            projects/
            data/projects.json
          retention-days: 1

  commit:
    needs: aggregate
    if: needs.aggregate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download generated output
        uses: actions/download-artifact@v4
        with:
          name: aggregated-project-pages

      - name: Commit aggregated pages and snapshot
        run: |
          git add project-sources projects data/projects.json
          git diff --cached --name-only | while read -r f; do
            case "$f" in
              project-sources/*/*|projects/*/*|data/projects.json) ;;
              *) echo "Refusing staged path: $f"; exit 1 ;;
            esac
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[aggregate] refresh project pages from project-sources [skip ci]"
          git push

      # Loop prevention: path filter is project-sources/** only; bot commits also touch
      # projects/ but those paths do not re-trigger. Never skip when HEAD changes project-sources.
