name: Aggregate project pages

# Trusted workflow + script always run from default branch (main).
# Project branches must not supply workflow definitions with write credentials.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force regeneration even when fingerprints match
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "project-sources/**"

concurrency:
  group: aggregate-projects-main
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[aggregate]'))
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Checkout main (trusted workflow + script + sources)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Skip loop when previous commit was aggregation bot
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="$(git log -1 --format=%s HEAD~1 2>/dev/null || true)"
          if echo "$msg" | grep -q '^\[aggregate\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run aggregation (JSON inputs only)
        if: steps.guard.outputs.skip != 'true'
        id: result
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          python3 scripts/aggregate_projects.py $FORCE
          if git diff --quiet -- projects data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated artifacts
        if: steps.guard.outputs.skip != 'true' && steps.result.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-project-pages
          path: |
            projects/
            data/projects.json
          retention-days: 1

  commit:
    needs: aggregate
    if: needs.aggregate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated output
        uses: actions/download-artifact@v4
        with:
          name: aggregated-project-pages

      - name: Commit aggregated pages
        run: |
          git add projects data/projects.json
          git diff --cached --name-only | while read -r f; do
            case "$f" in
              projects/*/*|data/projects.json) ;;
              *) echo "Refusing staged path: $f"; exit 1 ;;
            esac
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[aggregate] refresh project pages from project-sources [skip ci]"
          git push

      # Future: fetch manifest.json + activity.json from refs/heads/project/* with a
      # read-only sparse checkout; never run scripts from those branches.
